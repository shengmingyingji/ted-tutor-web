<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TED陪练 · 跟读发音评分</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">🎤 TED陪练</div>
  <div class="modebar">
    <button id="modeLocal" class="mode active">📁 本地原片</button>
    <button id="modeOnline" class="mode">🌐 在线视频</button>
  </div>
  <div class="header-actions">
    <button id="errBtn" class="ghost">错词本 <span id="errCount" class="badge">0</span></button>
  </div>
</header>

<div class="toolbar">
  <div id="localCtl" class="ctl">
    <select id="talkSelect" title="选择演讲"></select>
  </div>
  <div id="onlineCtl" class="ctl hidden">
    <input id="ytUrl" class="yt-inline" placeholder="粘贴 YouTube 链接：watch?v=… 或 youtu.be/…">
    <button id="ytLoadBtn" class="yt-inline-btn">载入</button>
    <button id="ytManualOpen" class="ghost">手动字幕</button>
  </div>
  <select id="segSelect" title="选择段落"></select>
</div>
<div id="ytStatus" class="yt-status"></div>

<main>
  <section id="mediaPane">
    <video id="video" controls preload="metadata"></video>
    <div id="ytmount" class="ytframe hidden"></div>
    <div class="media-tip" id="mediaTip">▶️ 先整体看一遍视频/听原声，再逐句跟读。无字幕时间轴，按句练习即可。</div>
  </section>

  <section id="practicePane">
    <div class="progress-bar"><div id="progressFill"></div></div>
    <div class="progress-text"><span id="segName">—</span> · 本段进度 <span id="segProgress">0/0</span></div>

    <div class="card">
      <div class="card-top">
        <span class="sent-index" id="sentIndex">#1</span>
        <div class="card-tools">
          <button id="listenBtn" title="听这一句的原声">▶ 听原声</button>
          <select id="speedSel" class="speed" title="播放速度">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
          </select>
          <span class="sub-toggle" title="字幕：中英双字幕 / 仅英文">
            <button id="subBi" class="subm active">中英</button>
            <button id="subEn" class="subm">英</button>
          </span>
        </div>
      </div>
      <p class="sent-en" id="sentEn">加载中…</p>
      <p class="sent-zh hidden" id="sentZh"></p>

      <div id="result" class="result hidden">
        <div class="score-row">
          <div class="score-main"><span id="scoreNum">0</span><small>分</small></div>
          <div class="score-sub">
            <div>准确度 <b id="accuracy">0%</b></div>
            <div>完整度 <b id="completeness">0%</b></div>
          </div>
        </div>
        <div class="diff-label">你的发音对照（<span class="ok-chip">绿=读对</span> <span class="miss-chip">红=漏读/不准</span>）：</div>
        <p class="diff" id="diff"></p>
        <div class="heard">识别到：<span id="heard">—</span></div>
      </div>
    </div>

    <div class="controls">
      <button id="prevBtn" class="nav">← 上一句</button>
      <button id="recBtn" class="rec">🎤 开始跟读</button>
      <button id="nextBtn" class="nav">下一句 →</button>
    </div>
    <div id="status" class="status"></div>
  </section>
</main>

<!-- 错词本抽屉 -->
<div id="errPanel" class="drawer hidden">
  <div class="drawer-head">
    <b>错词本</b>
    <div>
      <button id="exportBtn" class="ghost">导出（Anki/复盘）</button>
      <button id="closeErr" class="ghost">关闭</button>
    </div>
  </div>
  <div id="errList" class="err-list"></div>
</div>
<!-- 手动粘贴字幕抽屉 -->
<div id="ytPanel" class="drawer hidden">
  <div class="drawer-head">
    <b>手动粘贴字幕</b>
    <button id="closeYt" class="ghost">关闭</button>
  </div>
  <p class="yt-desc">在线版、或自动抓不到字幕时用：先在上方「在线视频」里载入 YouTube 链接播放，再把英文字幕贴到下面开始跟读。<br><span class="dim">每行一句；有中文用 <b>||</b> 分隔，如 <code>Hello||你好</code>。</span></p>
  <textarea id="ytManualText" class="yt-textarea" placeholder="Hello everyone||大家好&#10;Today we talk about AI||今天我们聊聊人工智能&#10;Let us begin||让我们开始"></textarea>
  <button id="ytManualBtn" class="yt-load">用粘贴的字幕开始</button>
</div>

<div id="mask" class="mask hidden"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="data/talks.js"></script>
<script src="app.js"></script>
</body>
</html>
